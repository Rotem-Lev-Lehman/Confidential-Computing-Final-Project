[project]
name = "project"
version = "0.1.0"
description = "Confidential Computing Final Project - SMPC"
readme = "README.md"
requires-python = ">=3.11"
# `cryptography` supplies the standard primitives around the protocol (Ed25519,
# X25519, HKDF, AES-GCM). The SMPC itself -- garbled circuits and oblivious
# transfer -- is implemented from scratch and pulls in nothing.
dependencies = [
    "cryptography>=42",
]

[project.scripts]
smpc-gc = "smpc_gc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: all Python lives under src/. The GC engine is a package; the
# networking / secure-summation layer is a set of top-level modules.
packages = ["src/smpc_gc"]
sources = ["src"]
include = [
    "src/config_loader.py",
    "src/gc_channel.py",
    "src/gc_handoff.py",
    "src/keygen.py",
    "src/node.py",
    "src/secret_sharing.py",
    "src/secure_channel.py",
    "src/secure_sum.py",
    "src/share_reduction.py",
    "src/sigma_handshake.py",
    "src/vectorize.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full-strength runs (2048-bit OT, multi-process pipelines)",
]
