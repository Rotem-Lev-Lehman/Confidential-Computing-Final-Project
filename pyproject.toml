[project]
name = "project"
version = "0.1.0"
description = "Confidential Computing Final Project - SMPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mpyc>=0.11",
]

[project.scripts]
smpc-gc = "smpc_gc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smpc_gc"]
